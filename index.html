<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" src="assets/volleyball-ball-solid.svg" type="image/x-icon" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Inicio de Sesión - Club Voleibol</title>
  <link rel="stylesheet" href="styles/index.css" />
  <script src="scripts/usuario.js"></script>
  <script src="scripts/index.js"></script>
</head>
<body>
  <section class="login-box">

    <div class="avatar">
      <img src="assets/volleyball-ball-solid.svg" alt="avatar">
    </div>

    <h2>Inicio de Sesión</h2>

    <form id="loginForm">

      <div class="input-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" required />
      </div>

      <div class="input-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" required />
      </div>

      <div class="options">
        <label id="cb"><input type="checkbox" /> Recuerdame</label>
        <a href="registro.html" id="registroLink">Registrarme</a>
      </div>

      <button type="submit" class="btn-main">INGRESAR</button>
      
    </form>

  </section>
</body>
</html>
